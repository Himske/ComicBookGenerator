<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8ed">
    <title>Comic Book Generator</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        color: #25211e;
        background: #fff8ed;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(ellipse at 85% 8%, #ffd9a8 0, transparent 28rem),
          #fff8ed;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 64px 0 80px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #a14c2d;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 4.3rem);
        line-height: 1;
        letter-spacing: -0.055em;
      }

      .intro {
        max-width: 540px;
        margin: 16px 0 30px;
        color: #655b53;
        font-size: 1.08rem;
        line-height: 1.6;
      }

      form, .comic-card {
        border: 1px solid #e8ddcf;
        border-radius: 18px;
        background: #fffdf9;
        box-shadow: 0 12px 36px #68421b12;
      }

      form { padding: clamp(20px, 5vw, 32px); }

      .field { margin-bottom: 20px; }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.92rem;
        font-weight: 700;
      }

      textarea, input, select {
        width: 100%;
        border: 1px solid #d8caba;
        border-radius: 10px;
        padding: 12px 14px;
        background: white;
        color: inherit;
        font: inherit;
      }

      textarea { min-height: 125px; resize: vertical; }
      input:focus, textarea:focus, select:focus {
        outline: 3px solid #eea65c66;
        border-color: #a14c2d;
      }

      .field-hint {
        margin: 7px 0 0;
        color: #766b61;
        font-size: 0.82rem;
      }

      .form-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 180px;
        gap: 18px;
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        padding: 0 20px;
        background: #a14c2d;
        color: white;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      button:hover { background: #843c24; }
      button:disabled { cursor: wait; opacity: 0.7; }

      #result { margin-top: 34px; }
      #status { min-height: 1.5em; color: #655b53; }
      #status.error { color: #a32323; }
      #comic[hidden] { display: none; }
      .comic-heading { margin: 26px 0 18px; }
      .comic-heading h2 { margin: 0 0 8px; font-size: 1.8rem; }
      .comic-meta { margin: 0; color: #766b61; font-size: 0.9rem; }
      .panels { display: grid; gap: 14px; }

      .comic-card { padding: 20px; }
      .comic-card h3 {
        margin: 0 0 12px;
        color: #a14c2d;
        font-size: 0.82rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .comic-card p { margin: 0 0 12px; line-height: 1.55; }
      .comic-card p:last-child { margin-bottom: 0; }
      .comic-card strong { color: #51463d; }

      @media (max-width: 560px) {
        main { padding-top: 42px; }
        .form-row { grid-template-columns: 1fr; gap: 0; }
        form button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Your next adventure starts here</p>
      <h1>Make a comic</h1>
      <p class="intro">Share a premise, pick your art style, and let the local model turn it into a panel-by-panel story.</p>

      <form id="comic-form">
        <div class="field">
          <label for="premise">Story premise</label>
          <textarea id="premise" name="premise" minlength="5" maxlength="2000" placeholder="A tiny astronaut discovers a forest growing on the moon..." required></textarea>
          <p class="field-hint">What happens in your story? (5–2,000 characters)</p>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="style">Art style</label>
            <input id="style" name="style" value="bright, expressive comic art" maxlength="200" required>
          </div>
          <div class="field">
            <label for="panel-count">Number of panels</label>
            <select id="panel-count" name="panel_count">
              <option value="1">1 panel</option>
              <option value="2">2 panels</option>
              <option value="3">3 panels</option>
              <option value="4" selected>4 panels</option>
              <option value="5">5 panels</option>
              <option value="6">6 panels</option>
              <option value="7">7 panels</option>
              <option value="8">8 panels</option>
              <option value="9">9 panels</option>
              <option value="10">10 panels</option>
              <option value="11">11 panels</option>
              <option value="12">12 panels</option>
            </select>
          </div>
        </div>
        <button id="submit-button" type="submit">
          <span id="button-label">Generate my comic</span>
        </button>
      </form>

      <section id="result" aria-live="polite" aria-busy="false">
        <p id="status" role="status"></p>
        <div id="comic" hidden></div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#comic-form");
      const button = document.querySelector("#submit-button");
      const buttonLabel = document.querySelector("#button-label");
      const status = document.querySelector("#status");
      const result = document.querySelector("#result");
      const comic = document.querySelector("#comic");

      function addText(parent, tag, text, className) {
        const element = document.createElement(tag);
        element.textContent = text;
        if (className) element.className = className;
        parent.append(element);
        return element;
      }

      function showComic(response) {
        comic.replaceChildren();
        comic.hidden = false;

        const heading = document.createElement("header");
        heading.className = "comic-heading";
        addText(heading, "h2", "Your comic");
        addText(heading, "p", `Style: ${response.style} · ID: ${response.comic_id}`, "comic-meta");
        comic.append(heading);

        const panels = document.createElement("div");
        panels.className = "panels";
        for (const panel of response.panels) {
          const card = document.createElement("article");
          card.className = "comic-card";
          addText(card, "h3", `Panel ${panel.number}`);
          addText(card, "p", panel.description);
          if (panel.dialogue) {
            const dialogue = document.createElement("p");
            addText(dialogue, "strong", "Dialogue: ");
            dialogue.append(document.createTextNode(panel.dialogue));
            card.append(dialogue);
          }
          const prompt = document.createElement("p");
          addText(prompt, "strong", "Image prompt: ");
          prompt.append(document.createTextNode(panel.image_prompt));
          card.append(prompt);
          panels.append(card);
        }
        comic.append(panels);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.className = "";
        status.textContent = "Creating your comic… This may take a little while.";
        comic.replaceChildren();
        comic.hidden = true;
        button.disabled = true;
        buttonLabel.textContent = "Generating…";
        result.setAttribute("aria-busy", "true");

        const formData = new FormData(form);
        const request = {
          premise: formData.get("premise"),
          panel_count: Number(formData.get("panel_count")),
          style: formData.get("style"),
        };

        try {
          const response = await fetch("/comics", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(request),
          });
          const body = await response.json();
          if (!response.ok) {
            const detail = typeof body.detail === "string"
              ? body.detail
              : "The comic could not be generated. Please try again.";
            throw new Error(detail);
          }
          status.textContent = "";
          showComic(body);
        } catch (error) {
          status.className = "error";
          status.textContent = error instanceof Error
            ? error.message
            : "Something went wrong while generating your comic.";
        } finally {
          button.disabled = false;
          buttonLabel.textContent = "Generate my comic";
          result.setAttribute("aria-busy", "false");
        }
      });
    </script>
  </body>
</html>
