<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8ed">
    <title>Generate a Comic | Comic Book Generator</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js?v=20261010-3" defer></script>
  </head>
  <body>
    <main>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/" aria-current="page">Generate a comic</a>
        <a href="/character/traits">Character from traits</a>
        <a href="/character/examples">Character from images</a>
      </nav>
      <p class="eyebrow">Your next adventure starts here</p>
      <h1>Make a comic</h1>
      <p class="intro">Share a premise, pick your art style, and let the local model turn it into a panel-by-panel story.</p>

      <form id="comic-form">
        <div class="field">
          <label for="premise">Story premise</label>
          <textarea id="premise" name="premise" minlength="5" maxlength="2000" placeholder="A tiny astronaut discovers a forest growing on the moon..." required></textarea>
          <p class="field-hint">What happens in your story? (5–2,000 characters)</p>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="style">Art style</label>
            <input id="style" name="style" value="bright, expressive comic art" maxlength="200" required>
          </div>
          <div class="field">
            <label for="panel-count">Number of panels</label>
            <select id="panel-count" name="panel_count">
              <option value="1">1 panel</option>
              <option value="2">2 panels</option>
              <option value="3">3 panels</option>
              <option value="4" selected>4 panels</option>
              <option value="5">5 panels</option>
              <option value="6">6 panels</option>
              <option value="7">7 panels</option>
              <option value="8">8 panels</option>
              <option value="9">9 panels</option>
              <option value="10">10 panels</option>
              <option value="11">11 panels</option>
              <option value="12">12 panels</option>
            </select>
          </div>
        </div>
        <button id="submit-button" type="submit">
          <span id="button-label">Generate my comic</span>
        </button>
      </form>

      <section id="result" aria-live="polite" aria-busy="false">
        <p id="status" role="status"></p>
        <div id="comic" hidden></div>
      </section>
    </main>

  </body>
</html>
